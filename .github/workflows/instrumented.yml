# Instrumented Room migration tests on an Android emulator.
#
# Runs core:data DatabaseMigrationTest (MigrationTestHelper against real
# exported schemas) on a GitHub-hosted emulator. Emulator jobs are slow, so
# this is manual + nightly only; the JVM migration-chain test
# (DatabaseMigrationChainTest) already runs on every push in ci.yml.

name: Instrumented tests

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Emulator API level
        default: '34'
        type: string
  schedule:
    # 07:30 UTC nightly
    - cron: '30 7 * * *'

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-test:
    name: core:data DatabaseMigrationTest (API ${{ inputs.api-level || '34' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: ${{ inputs.api-level || '34' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile the instrumentation APKs before booting the emulator so the
      # emulator only lives for the test run itself.
      - name: Assemble core:data androidTest
        run: ./gradlew :core:data:assembleDebugAndroidTest --no-daemon

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-google_apis

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run DatabaseMigrationTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.avago.core.data.db.DatabaseMigrationTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-data-androidTest-reports
          path: |
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
